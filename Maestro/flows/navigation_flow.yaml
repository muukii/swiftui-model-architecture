appId: app.muukii.ModelArchitecture
---
- launchApp
- assertVisible: "Home"
- assertVisible: "Item 1"
- assertVisible: "Item 2"
- assertVisible: "Item 3"

# Open detail for Item 2
- tapOn: "Item 2"
